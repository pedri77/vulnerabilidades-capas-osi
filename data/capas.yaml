# Catálogo de vulnerabilidades y protecciones por capa OSI (protección on-premise por capas).
# Convenciones:
# - La capa de una clase es la capa donde se produce el ataque o su impacto principal. La capa de cada
#   protocolo es la de security-manager-control (data/smc_protocolos.yaml), que puede no coincidir
#   (BGP y DHCP están en la capa 7 en SMC y aquí aparecen en clases de capa 3 y 2).
# - cwe: ids de MITRE CWE. attack: técnicas de MITRE ATT&CK (T1xxx Enterprise, T0xxx ICS).
#   Comprobados contra cwe.mitre.org y attack.mitre.org con tools/verificar_ids.py (data/verificacion_ids.yaml).
#   CWE-345, CWE-400 y CWE-693 tienen uso DISCOURAGED en MITRE (son abstractos); se mantienen donde SMC los usa
#   para el mismo protocolo (ARP, BGP, DNS, ICMP) o no hay un hijo claro (túneles). La página lo marca.
# - ens: medidas del Anexo II del RD 311/2022 (solo ids de data/ens_ids.txt). nis2: letras del art. 21.2
#   de la Directiva (UE) 2022/2555 con el formato de SMC (NIS2-21.2.x).
# - Sin CVE concretos: cada clase lleva búsquedas en fuentes oficiales (consulta). Mapeo orientativo,
#   juicio inicial del autor sin auditoría externa.
version: v1
capas:
- id: L1
  numero: 1
  nombre: Física
  descripcion: Medio de transmisión, cableado, radiofrecuencia, puertos físicos y salas donde viven los equipos.
  activos: [Armarios y racks de comunicaciones, Cableado estructurado y fibra, Rosetas y puertos de red en puestos, Puntos de acceso Wi-Fi, Salas CPD]
  clases:
  - id: L1-ACCESO-FISICO
    nombre: Acceso físico y dispositivos implantados
    descripcion: Conexión de equipos no autorizados (implantes de red, mini PC, puntos de acceso) a rosetas libres o armarios abiertos.
    cwe: [CWE-1263]
    attack: [T1200]
    protocolos: [EAP_8021X]
    controles:
    - Armarios y salas con cierre y control de acceso registrado
    - Puertos de switch sin uso deshabilitados (shutdown) y asignados a una VLAN aislada
    - 802.1X o NAC en todos los puertos de acceso
    - Inventario de equipos conectados contrastado con el inventario de activos
    deteccion: [Eventos link up y down del switch (syslog), Registro del NAC y del servidor RADIUS, Control de acceso físico y videovigilancia]
    ens: [ENS-mp.if.1, ENS-mp.eq.4, ENS-op.exp.1]
    nis2: [NIS2-21.2.i]
    palabra_clave: hardware%20implant
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=hardware%20implant&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=hardware%20implant
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=hardware%20implant
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=hardware%20implant
  - id: L1-INTERCEPCION-MEDIO
    nombre: Intercepción del medio
    descripcion: Derivación pasiva (TAP) en cobre o fibra o captura de radiofrecuencia para leer tráfico sin cifrar.
    cwe: [CWE-319]
    attack: [T1040]
    protocolos: [TELNET, FTP, HTTP]
    controles:
    - Canalizaciones protegidas y cableado en zonas controladas
    - MACsec (IEEE 802.1AE) en enlaces entre edificios o salas sin control
    - Cifrado extremo a extremo (TLS, SSH, IPsec) para que la captura no sirva
    deteccion: [Alarmas de pérdida de señal o atenuación en fibra, Inspección física periódica del cableado]
    ens: [ENS-mp.com.2, ENS-mp.if.1]
    nis2: [NIS2-21.2.h, NIS2-21.2.j]
    palabra_clave: cleartext%20transmission
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=cleartext%20transmission&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=cleartext%20transmission
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=cleartext%20transmission
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=cleartext%20transmission

- id: L2
  numero: 2
  nombre: Enlace de datos
  descripcion: Tramas, direcciones MAC, switches, VLAN y Wi-Fi; decide quién habla dentro del segmento.
  activos: [Switches de acceso y distribución, Controladoras y puntos de acceso Wi-Fi, Servidores RADIUS y NAC, Servidores DHCP]
  clases:
  - id: L2-ARP-SPOOFING
    nombre: ARP spoofing (envenenamiento de caché ARP)
    descripcion: Respuestas ARP falsas para suplantar la puerta de enlace y ponerse en medio del tráfico.
    cwe: [CWE-345, CWE-290]
    attack: [T1557.002, T1040]
    protocolos: [ARP]
    controles:
    - Dynamic ARP Inspection (DAI) apoyado en la tabla de DHCP snooping
    - Entradas ARP estáticas para pasarelas críticas
    - Port security y VLAN pequeñas por función
    deteccion: [Registros de DAI en el switch, Cambios de MAC de la puerta de enlace (arpwatch o NDR), IDS de red]
    ens: [ENS-mp.com.3, ENS-op.exp.2, ENS-op.mon.1]
    nis2: [NIS2-21.2.a, NIS2-21.2.j]
    palabra_clave: ARP%20spoofing
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=ARP%20spoofing&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=ARP%20spoofing
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=ARP%20spoofing
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=ARP%20spoofing
  - id: L2-MAC-FLOODING
    nombre: MAC flooding
    descripcion: Inundación de la tabla CAM del switch para que reenvíe tramas a todos los puertos como un concentrador.
    cwe: [CWE-770]
    attack: [T1040]
    protocolos: []
    controles:
    - Port security con número máximo de MAC por puerto y acción shutdown o restrict
    - 802.1X en puertos de acceso
    - Alertas por llenado de la tabla CAM
    deteccion: [Violaciones de port security (syslog o SNMP traps), Uso de la tabla CAM en la monitorización del switch]
    ens: [ENS-op.exp.2, ENS-op.mon.3]
    nis2: [NIS2-21.2.a]
    palabra_clave: MAC%20flooding
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=MAC%20flooding&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=MAC%20flooding
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=MAC%20flooding
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=MAC%20flooding
  - id: L2-VLAN-HOPPING
    nombre: VLAN hopping
    descripcion: Salto de VLAN por negociación automática de troncales (switch spoofing) o doble etiquetado 802.1Q.
    cwe: [CWE-1188]
    attack: [T1599]
    protocolos: []
    controles:
    - Deshabilitar la negociación dinámica de troncales en puertos de acceso
    - Puertos de acceso fijos (modo access) y troncales con lista explícita de VLAN permitidas
    - VLAN nativa sin uso y etiquetada en troncales; no usar la VLAN 1
    deteccion: [Cambios de configuración de puertos (syslog y gestor de configuración), Tráfico entre VLAN no esperado en NDR]
    ens: [ENS-op.exp.2, ENS-op.exp.3, ENS-mp.com.4]
    nis2: [NIS2-21.2.a, NIS2-21.2.e]
    palabra_clave: VLAN%20hopping
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=VLAN%20hopping&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=VLAN%20hopping
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=VLAN%20hopping
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=VLAN%20hopping
  - id: L2-STP
    nombre: Manipulación de STP
    descripcion: Envío de BPDU para convertirse en puente raíz, desviar tráfico o provocar recálculos continuos de la topología.
    cwe: [CWE-346]
    attack: [T1557]
    protocolos: []
    controles:
    - BPDU Guard en puertos de usuario y PortFast solo en puertos de borde
    - Root Guard en puertos que nunca deben llevar al puente raíz
    - Prioridad de puente raíz fijada en los equipos de núcleo
    deteccion: [Cambios de topología y de puente raíz (syslog, SNMP traps), Puertos en err-disabled por BPDU Guard]
    ens: [ENS-op.exp.2, ENS-op.mon.3]
    nis2: [NIS2-21.2.a]
    palabra_clave: spanning%20tree
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=spanning%20tree&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=spanning%20tree
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=spanning%20tree
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=spanning%20tree
  - id: L2-DHCP-SPOOFING
    nombre: DHCP spoofing y agotamiento
    descripcion: Servidor DHCP falso que entrega otra puerta de enlace o DNS, o agotamiento del ámbito con solicitudes masivas.
    cwe: [CWE-346, CWE-770]
    attack: [T1557.003]
    protocolos: [DHCP]
    controles:
    - DHCP snooping con puertos de confianza solo hacia los servidores legítimos
    - Límite de tasa de DHCP por puerto
    - Port security para frenar el agotamiento por MAC aleatorias
    deteccion: [Registros de DHCP snooping, Avisos de servidor DHCP no autorizado, Ocupación del ámbito en el servidor DHCP]
    ens: [ENS-op.exp.2, ENS-mp.com.3]
    nis2: [NIS2-21.2.a]
    palabra_clave: DHCP%20spoofing
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=DHCP%20spoofing&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=DHCP%20spoofing
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=DHCP%20spoofing
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=DHCP%20spoofing
  - id: L2-WIFI-ROGUE
    nombre: Punto de acceso falso y gemelo malvado
    descripcion: Red Wi-Fi que imita la corporativa para capturar credenciales EAP o ponerse en medio.
    cwe: [CWE-295, CWE-522]
    attack: [T1557, T1040]
    protocolos: [EAP_8021X]
    controles:
    - WPA3-Enterprise o WPA2-Enterprise con EAP-TLS
    - Validación del certificado del servidor RADIUS en los clientes (perfil gestionado)
    - Detección y contención de puntos de acceso no autorizados (WIDS/WIPS)
    deteccion: [WIDS/WIPS de la controladora, Registros del servidor RADIUS (fallos de EAP)]
    ens: [ENS-mp.com.2, ENS-op.acc.6, ENS-op.mon.1]
    nis2: [NIS2-21.2.h, NIS2-21.2.j]
    palabra_clave: rogue%20access%20point
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=rogue%20access%20point&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=rogue%20access%20point
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=rogue%20access%20point
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=rogue%20access%20point
  - id: L2-NAC-BYPASS
    nombre: Suplantación de MAC para saltar el NAC
    descripcion: Copia de la MAC de un equipo autorizado (impresora, teléfono IP) para entrar por puertos con autenticación solo por MAC.
    cwe: [CWE-290]
    attack: [T1200]
    protocolos: [EAP_8021X]
    controles:
    - 802.1X con EAP-TLS en lugar de autenticación solo por MAC
    - Perfilado de dispositivos en el NAC y VLAN restringida para equipos sin 802.1X
    - MACsec donde el equipo lo soporte
    deteccion: [NAC (misma MAC en dos puertos, perfil distinto del esperado), Registros RADIUS]
    ens: [ENS-op.acc.1, ENS-mp.eq.4]
    nis2: [NIS2-21.2.i]
    palabra_clave: MAC%20authentication%20bypass
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=MAC%20authentication%20bypass&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=MAC%20authentication%20bypass
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=MAC%20authentication%20bypass
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=MAC%20authentication%20bypass

- id: L3
  numero: 3
  nombre: Red
  descripcion: Direccionamiento IP, enrutamiento, ICMP, fragmentación y túneles entre redes.
  activos: [Routers de borde y de núcleo, Firewalls perimetrales e internos, Concentradores VPN, Switches de capa 3]
  clases:
  - id: L3-IP-SPOOFING
    nombre: IP spoofing
    descripcion: Paquetes con dirección de origen falsa para evadir filtros o reflejar tráfico contra un tercero.
    cwe: [CWE-290]
    attack: [T1498.002]
    protocolos: []
    controles:
    - Filtrado de entrada y salida según BCP38 (RFC 2827) en el borde
    - uRPF en modo estricto en interfaces hacia usuarios
    - ACL antispoofing (rangos privados y propios entrando desde fuera)
    deteccion: [Contadores de descarte por uRPF y ACL, NetFlow o IPFIX en el borde]
    ens: [ENS-mp.com.1, ENS-op.exp.2]
    nis2: [NIS2-21.2.a]
    palabra_clave: IP%20spoofing
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=IP%20spoofing&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=IP%20spoofing
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=IP%20spoofing
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=IP%20spoofing
  - id: L3-ENRUTAMIENTO
    nombre: Ataques al enrutamiento
    descripcion: Secuestro o fuga de prefijos BGP e inyección de rutas en protocolos internos (OSPF, EIGRP) sin autenticar.
    cwe: [CWE-345, CWE-306]
    attack: [T1557]
    protocolos: [BGP]
    controles:
    - RPKI con validación de origen (ROV) y filtrado de prefijos por vecino
    - Límite de prefijos y autenticación de sesiones (TCP-AO o MD5) en BGP
    - Autenticación en OSPF y EIGRP e interfaces pasivas donde no hay vecinos
    deteccion: [Cambios de vecindad y de tabla de rutas (syslog), Monitorización externa de anuncios de prefijos propios]
    ens: [ENS-mp.com.1, ENS-mp.com.3, ENS-op.exp.2]
    nis2: [NIS2-21.2.a, NIS2-21.2.j]
    palabra_clave: BGP
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=BGP&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=BGP
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=BGP
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=BGP
  - id: L3-FRAGMENTACION
    nombre: Abuso de la fragmentación
    descripcion: Fragmentos solapados o diminutos para evadir el IDS o agotar el reensamblado del destino.
    cwe: [CWE-130, CWE-770]
    attack: [T1499.001]
    protocolos: []
    controles:
    - Reensamblado y normalización de fragmentos en el firewall o IPS antes de inspeccionar
    - Descarte de fragmentos solapados y de fragmentos iniciales demasiado pequeños
    - Firmware al día en equipos que reensamblan
    deteccion: [Alertas de anomalía de fragmentación en el IDS/IPS, Contadores de fragmentos descartados en el firewall]
    ens: [ENS-op.mon.1, ENS-op.exp.4]
    nis2: [NIS2-21.2.a, NIS2-21.2.e]
    palabra_clave: IP%20fragmentation
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=IP%20fragmentation&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=IP%20fragmentation
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=IP%20fragmentation
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=IP%20fragmentation
  - id: L3-ICMP
    nombre: Abuso de ICMP
    descripcion: Reconocimiento, túneles encubiertos sobre ICMP, redirecciones e inundación.
    cwe: [CWE-400]
    attack: [T1018, T1095, T1498]
    protocolos: [ICMP]
    controles:
    - Permitir solo los tipos ICMP necesarios (por ejemplo, los de PMTUD) en el perímetro
    - Deshabilitar ICMP redirect en routers y servidores
    - Límite de tasa de ICMP
    deteccion: [NetFlow (volumen y tamaño de carga ICMP), IDS de red]
    ens: [ENS-mp.com.1, ENS-op.mon.1]
    nis2: [NIS2-21.2.a]
    palabra_clave: ICMP
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=ICMP&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=ICMP
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=ICMP
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=ICMP
  - id: L3-IPV6-RA
    nombre: Anuncios de router IPv6 falsos
    descripcion: Router Advertisement o DHCPv6 falsos en redes donde IPv6 está activo sin gestionar, para ponerse en medio.
    cwe: [CWE-346]
    attack: [T1557]
    protocolos: []
    controles:
    - RA Guard y DHCPv6 Guard en switches de acceso
    - Gestionar IPv6 de forma explícita (o deshabilitarlo en el sistema si no se usa)
    - Inspección de Neighbor Discovery donde el switch la soporte
    deteccion: [Registros de RA Guard, NDR (routers IPv6 no esperados)]
    ens: [ENS-op.exp.2, ENS-mp.com.3]
    nis2: [NIS2-21.2.a]
    palabra_clave: IPv6%20router%20advertisement
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=IPv6%20router%20advertisement&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=IPv6%20router%20advertisement
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=IPv6%20router%20advertisement
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=IPv6%20router%20advertisement
  - id: L3-VPN
    nombre: VPN y túneles débiles o sin parchear
    descripcion: IPsec con claves precompartidas débiles o algoritmos obsoletos y concentradores VPN expuestos sin parches.
    cwe: [CWE-326, CWE-327, CWE-521]
    attack: [T1133, T1190]
    protocolos: [IPSEC_IKE]
    controles:
    - IKEv2 con certificados y algoritmos modernos
    - Parcheo prioritario de VPN perimetrales (vigilar CISA KEV)
    - MFA en el acceso remoto
    deteccion: [Registros del concentrador VPN (autenticaciones y errores), Alertas de inicio de sesión anómalo en el SIEM]
    ens: [ENS-op.acc.5, ENS-op.exp.4, ENS-mp.com.2]
    nis2: [NIS2-21.2.e, NIS2-21.2.h, NIS2-21.2.j]
    palabra_clave: IKE
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=IKE&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=IKE
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=IKE
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=IKE

- id: L4
  numero: 4
  nombre: Transporte
  descripcion: Puertos, TCP y UDP, establecimiento de conexión, estado y presión sobre los servicios.
  activos: [Firewalls con estado, Balanceadores de carga, Protección antiDDoS, Servidores con servicios publicados]
  clases:
  - id: L4-SYN-FLOOD
    nombre: SYN flood
    descripcion: Conexiones TCP a medio abrir que agotan la tabla de estado del servidor, el firewall o el balanceador.
    cwe: [CWE-770]
    attack: [T1499.001, T1498.001]
    protocolos: []
    controles:
    - SYN cookies en servidores y balanceadores
    - Límites de conexiones embrionarias y de tasa por origen en el firewall
    - Protección antiDDoS aguas arriba (operador o servicio) para volumen
    deteccion: [Contadores de conexiones medio abiertas del firewall o balanceador, NetFlow, Monitorización de disponibilidad]
    ens: [ENS-mp.s.4, ENS-op.pl.4]
    nis2: [NIS2-21.2.a, NIS2-21.2.c]
    palabra_clave: SYN%20flood
    consulta:
      nvd: https://nvd.nist.gov/vuln/search?keyword=SYN%20flood&resultType=records
      euvd: https://euvd.enisa.europa.eu/search?text=SYN%20flood
      cisa_kev: https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=SYN%20flood
      cvedetails: https://www.cvedetails.com/google-search-results.php?q=SYN%20flood
  - id: L4-AMPLIFICACION
    nombre: Reflexión y amplificación UDP
    descripcion: Servicios UDP propios (DNS, NTP, SNMP) usados como reflectores contra terceros, o la organización como víctima.
    cwe: [CWE-406]
    attack: [T1498.002]
    protocolos: [DNS, NTP, SNMP]
    controles:
    - Sin resolutores DNS abiertos ni monlist en NTP; SNMP no expuesto a Internet
    - Filtrado BCP38 para no originar tráfico falsificado
    - Límite de tasa de respuestas (RRL en DNS)
    deteccion: [NetFlow (asimetría de tráfico UDP de salida), Registros del servidor DNS y NTP]
    ens: [ENS-mp.s.4, ENS-op.exp.2]
    nis2: [NIS2-21.2.a]
    palabra_clave: amplification
    consulta:
