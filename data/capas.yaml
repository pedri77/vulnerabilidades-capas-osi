- id: TX
  numero: null
  nombre: Transversal
  descripcion: "Debilidades que cruzan varias capas: segmentación, plano de gestión, registro y ciclo de vida de los equipos."
  activos: [Todos los equipos de red y seguridad, Red de gestión, SIEM y recolectores de registros, Servidores de gestión]
  clases:
  - id: TX-SEGMENTACION
    nombre: Red plana y movimiento lateral
    descripcion: Falta de separación entre zonas que permite saltar de un equipo comprometido al resto.
    cwe: [CWE-653]
    attack: [T1021, T1210, T1570]
    protocolos: [SMB, RDP, SSH]
    controles:
    - Zonas por función y criticidad con firewall interno y ACL este-oeste
    - Microsegmentación en servidores críticos
    - Pruebas de segmentación periódicas
    deteccion: [Registros del firewall interno, NDR (conexiones entre zonas no esperadas)]
    ens: [ENS-mp.com.4, ENS-op.pl.2, ENS-mp.com.1]
