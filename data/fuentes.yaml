# Fuentes oficiales y de referencia del catálogo.
# Formato y comprobación heredados de security-manager-control (vulnerabilities/sources.yaml).
# verificacion: auto = tools/verificar_ids.py --urls comprueba que responde 200;
#               manual = el sitio bloquea clientes automáticos (403 de su cortafuegos) y se abre a mano.
# EUR-Lex responde 202 (comprobación anti-bot) a clientes automáticos.
# CCN-CERT y CVE Details devuelven 403 a curl y a Chrome sin interfaz el 2026-11-03. Las URL de las guías
# CCN-STIC proceden del índice de un buscador ese mismo día y no se han podido abrir de forma automática.
version: v1
fuentes:
- id: nvd
  nombre: NVD
  organismo: NIST (EE. UU.)
  url: https://nvd.nist.gov/
  tipo: base_vulnerabilidades
  uso: Fuente principal de CVE con CVSS y CPE; búsqueda por palabra clave (consulta.nvd de cada clase).
  verificacion: auto
- id: euvd
  nombre: EUVD
  organismo: ENISA (UE)
  url: https://euvd.enisa.europa.eu/
  tipo: base_vulnerabilidades
  uso: Base europea de vulnerabilidades; contexto UE y explotación activa.
  verificacion: auto
- id: cisa_kev
  nombre: CISA KEV
  organismo: CISA (EE. UU.)
  url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  tipo: explotadas_activamente
  uso: Catálogo de vulnerabilidades explotadas; prioriza el parcheo de servicios publicados.
  verificacion: auto
- id: cve_details
  nombre: CVE Details
  organismo: SecurityScorecard (comercial)
  url: https://www.cvedetails.com/
  tipo: agregador
  uso: Consulta cómoda por producto y proveedor; no es fuente oficial, contrastar con NVD.
  verificacion: manual
- id: mitre_cwe
  nombre: MITRE CWE
  organismo: MITRE
  url: https://cwe.mitre.org/
  tipo: taxonomia
  uso: Catálogo de debilidades citadas en cada clase.
  verificacion: auto
- id: mitre_attck
  nombre: MITRE ATT&CK
  organismo: MITRE
  url: https://attack.mitre.org/
  tipo: taxonomia
  uso: Técnicas ATT&CK Enterprise e ICS citadas en cada clase.
  verificacion: auto
- id: incibe_cert
  nombre: INCIBE-CERT
  organismo: INCIBE (España)
  url: https://www.incibe.es/incibe-cert/alerta-temprana/vulnerabilidades
  tipo: avisos_nacionales
  uso: Avisos de vulnerabilidades en español para empresas y operadores.
  verificacion: auto
- id: ccn_cert
  nombre: CCN-CERT
  organismo: CCN (España)
  url: https://www.ccn-cert.cni.es/es/seguridad-al-dia/vulnerabilidades.html
  tipo: avisos_nacionales
  uso: Avisos para administraciones y operadores del ENS.
  verificacion: manual
- id: ccn_stic_811
  nombre: CCN-STIC 811 Interconexión en el ENS
  organismo: CCN (España)
  url: https://www.ccn-cert.cni.es/series-ccn-stic/800-guia-esquema-nacional-de-seguridad/521-ccn-stic-811-interconexion-en-el-ens/file.html
  tipo: guia
  uso: Arquitecturas de perímetro e interconexión de sistemas (capas 3 y 4, segmentación).
  verificacion: manual
- id: ccn_stic_816
  nombre: CCN-STIC 816 Seguridad en redes inalámbricas en el ENS
  organismo: CCN (España)
  url: https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/2317-ccn-stic-816-seguridad-en-redes-inalambricas-en-el-ens/file.html
  tipo: guia
  uso: Requisitos del ENS para redes Wi-Fi 802.11 (capas 1 y 2).
  verificacion: manual
- id: ccn_stic_800
  nombre: Serie CCN-STIC 800 (guías del ENS, incluida la 812 de entornos y aplicaciones web)
  organismo: CCN (España)
  url: https://www.ccn-cert.cni.es/gl/pdf/guias/series-ccn-stic.html
  tipo: guia
  uso: Índice de guías del ENS; la CCN-STIC 812 (capa 7, aplicaciones web) se descarga desde aquí.
  verificacion: manual
- id: ens_rd311
  nombre: Real Decreto 311/2022 (ENS)
  organismo: BOE (España)
  url: https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191
  tipo: norma
  uso: Texto consolidado del ENS; las medidas del Anexo II dan los ids ENS-*.
  verificacion: auto
- id: nis2
  nombre: Directiva (UE) 2022/2555 (NIS2)
  organismo: EUR-Lex (UE)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  tipo: norma
  uso: Artículo 21.2, letras a) a j), de medidas de gestión de riesgos.
  verificacion: manual
