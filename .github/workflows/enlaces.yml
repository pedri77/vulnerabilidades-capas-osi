name: Enlaces
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: enlaces
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFORME: informe.md
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # Exit 0 with or without problems: a failure here means the check itself broke.
      - run: python tools/verificar_ids.py --informe "$INFORME"
      - name: Open, update or close the single issue
        run: |
          gh label create enlaces --color D93F0B --description "Comprobación semanal de enlaces" --force
          n=$(gh issue list --state open --label enlaces --limit 1 --json number --jq '.[0].number // empty')
          if [ -s "$INFORME" ]; then
            if [ -n "$n" ]; then
              gh issue edit "$n" --body-file "$INFORME"
            else
              gh issue create --title "Enlaces o identificadores rotos" --label enlaces --body-file "$INFORME"
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "La comprobación semanal ya no encuentra problemas."
          fi
