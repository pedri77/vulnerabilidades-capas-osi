atch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Llave y candado: claves derivadas en cada extremo; estuche cerrado = cifrado</span></span><span class="iso-caption">TLS 1.3 completo en 1-RTT (RFC 8446). El ClientHello (versiones admitidas, suites de cifrado y key_share ECDHE, por ejemplo X25519) y el ServerHello viajan en claro, y con ellos el nombre del servidor (SNI), salvo que se use ECH. Con los dos key_share, cada lado calcula el mismo secreto y deriva las claves con HKDF: el secreto nunca pasa por el cable. Lo demás va cifrado: EncryptedExtensions, Certificate, CertificateVerify y Finished del servidor (enviados justo detrás del ServerHello), el Finished del cliente y los datos de aplicación con AEAD (AES-GCM o ChaCha20-Poly1305). Los tiempos cuentan desde el envío del ClientHello y no incluyen el cálculo. Nota: 0-RTT y la reanudación con PSK no se muestran.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;

function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

const tenth = (value) => {

function pathOf(points, closed = false) {

            const next = (index + 1) % count;

            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
